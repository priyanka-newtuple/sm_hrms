name: sm-hrms

x-api: &api
  image: sm-hrms-api:local
  build:
    context: ./backend
    dockerfile: hrms/Dockerfile
  environment: &environment
    ENV: development
    DATABASE_URL: postgresql+asyncpg://sm_hrms:${HRMS_DB_PASSWORD:?Run the HRMS setup script}@db:5432/sm_hrms
    JWT_SECRET: ${HRMS_JWT_SECRET:?Run the HRMS setup script}
    JWT_SECRET_KEY: ${HRMS_JWT_SECRET:?Run the HRMS setup script}
    ENV_FILE: /nonexistent-platform-env
    HRMS_ORGANIZATION_ID: 11111111-1111-1111-1111-111111111111
    HRMS_ALLOW_DEV_LOGIN: "true"
    FRONTEND_URL: http://localhost:5181
    CORS_ORIGINS: '["http://localhost:5181"]'
    GOOGLE_REDIRECT_URI: http://localhost:5181/api/v1/auth/google/callback
    DOCUMENT_STORAGE_DIR: /app/storage/documents
    EMAIL_ENABLED: "false"
    FLOWTUPLE_ENABLED: "false"
  depends_on:
    db:
      condition: service_healthy

services:
  platform-db:
    profiles: ["native"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sm_hrms
      POSTGRES_PASSWORD: ${HRMS_DB_PASSWORD:?Run the HRMS setup script}
      POSTGRES_DB: sm_hrms_platform
    ports: ["127.0.0.1:5457:5432"]
    volumes: ["hrms_platform_db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sm_hrms -d sm_hrms_platform"]
      interval: 3s
      timeout: 3s
      retries: 30
  platform-redis:
    profiles: ["native"]
    image: redis:7-alpine
    command: ["redis-server", "--port", "6380", "--save", "", "--appendonly", "no", "--requirepass", "${HRMS_DB_PASSWORD:?Run the HRMS setup script}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 6380 -a '${HRMS_DB_PASSWORD}' ping | grep PONG"]
      interval: 3s
      timeout: 3s
      retries: 30
  platform-api:
    profiles: ["native"]
    image: sm-hrms-platform:local
    build:
      context: .
      dockerfile: applications/hrms_api/platform.Dockerfile
    environment: &platform_environment
      ENV_FILE: /nonexistent-platform-env
      POSTGRES_HOST: platform-db
      POSTGRES_PORT: "5432"
      POSTGRES_USERNAME: sm_hrms
      POSTGRES_PASSWORD: ${HRMS_DB_PASSWORD:?Run the HRMS setup script}
      POSTGRES_DATABASE: sm_hrms_platform
      POSTGRES_APP_SCHEMA: modular_backend
      DATABASE_URL: postgresql://sm_hrms:${HRMS_DB_PASSWORD}@platform-db:5432/sm_hrms_platform
      SQLALCHEMY_DATABASE_MIGRATION_URL: postgresql://sm_hrms:${HRMS_DB_PASSWORD}@platform-db:5432/sm_hrms_platform
      ALEMBIC_CONFIG_PATH: /app/backend/alembic.ini
      REDIS_HOST: platform-redis
      REDIS_PORT: "6380"
      REDIS_PASSWORD: ${HRMS_DB_PASSWORD:?Run the HRMS setup script}
      JWT_SECRET_KEY: ${HRMS_JWT_SECRET:?Run the HRMS setup script}
      PORT: "8000"
      BOOTSTRAP_ORG_ID: 11111111-1111-1111-1111-111111111111
      BOOTSTRAP_ORG_NAME: HRMS Local
      BOOTSTRAP_ORG_SLUG: hrms-local
      DEFAULT_ORG_ID: 11111111-1111-1111-1111-111111111111
      BOOTSTRAP_ADMIN_EMAIL: hrms-admin@newtuple.com
      BOOTSTRAP_ADMIN_PASSWORD: ${HRMS_PLATFORM_ADMIN_PASSWORD:?Run the HRMS setup script}
      BOOTSTRAP_SUPER_ADMIN_EMAIL: hrms-superadmin@newtuple.com
      BOOTSTRAP_SUPER_ADMIN_PASSWORD: ${HRMS_PLATFORM_ADMIN_PASSWORD:?Run the HRMS setup script}
      FRONTEND_URL: http://localhost:5182
      ACTION_RUNS_WORKER_ENABLED: "false"
      BULK_IMPORT_WORKER_ENABLED: "false"
    depends_on:
      platform-db:
        condition: service_healthy
      platform-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
  platform-install:
    profiles: ["native"]
    image: sm-hrms-application:local
    build: ./applications/hrms_api
    environment: &hrms_install_environment
      PLATFORM_API_URL: http://platform-api:8000/v1/api
      HRMS_ORGANIZATION_ID: 11111111-1111-1111-1111-111111111111
      HRMS_INSTALL_EMAIL: hrms-admin@newtuple.com
      HRMS_INSTALL_PASSWORD: ${HRMS_PLATFORM_ADMIN_PASSWORD}
      HRMS_PLATFORM_OWNER_EMAIL: hrms-superadmin@newtuple.com
      HRMS_PLATFORM_OWNER_PASSWORD: ${HRMS_PLATFORM_ADMIN_PASSWORD}
      HRMS_SERVICE_EMAIL: hrms-app-service@newtuple.com
      HRMS_SERVICE_PASSWORD: ${HRMS_SERVICE_PASSWORD:?Run the HRMS setup script}
    command: ["python", "-m", "hrms_app.install"]
    depends_on:
      platform-api:
        condition: service_healthy
  platform-step-migrate:
    profiles: ["migration"]
    image: sm-hrms-application:local
    environment:
      <<: *hrms_install_environment
      HRMS_STEP_SOURCE_DATABASE_URL: postgresql://sm_hrms:${HRMS_DB_PASSWORD}@platform-db:5432/sm_hrms_platform
      PYTHONPATH: /app
    volumes: ["./applications/hrms_api/tools:/tools:ro"]
    command: ["python", "/tools/migrate_existing_steps.py"]
  hrms-smoke:
    profiles: ["test"]
    image: sm-hrms-application:local
    environment:
      <<: *hrms_install_environment
      PYTHONPATH: /app
      HRMS_LOCAL_SMOKE: "true"
      HRMS_DEMO_EMPLOYEE_PASSWORD: ${HRMS_DEMO_EMPLOYEE_PASSWORD}
      HRMS_DEMO_MANAGER_PASSWORD: ${HRMS_DEMO_MANAGER_PASSWORD}
    volumes: ["./applications/hrms_api/tools:/tools:ro"]
    command: ["python", "/tools/smoke_local.py"]
  platform-web:
    profiles: ["native"]
    image: sm-hrms-platform-web:local
    build:
      context: ./frontend
      dockerfile: Dockerfile.platform
    ports: ["127.0.0.1:5182:80"]
    depends_on:
      hrms-app:
        condition: service_healthy
  hrms-app-db:
    profiles: ["native"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hrms_application
      POSTGRES_PASSWORD: ${HRMS_APP_DB_PASSWORD:?Run the HRMS setup script}
      POSTGRES_DB: hrms_application
    volumes: ["hrms_application_db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrms_application -d hrms_application"]
      interval: 3s
      timeout: 3s
      retries: 30
  hrms-app:
    profiles: ["native"]
    image: sm-hrms-application:local
    build: ./applications/hrms_api
    environment:
      PLATFORM_API_URL: http://platform-api:8000/v1/api
      HRMS_ORGANIZATION_ID: 11111111-1111-1111-1111-111111111111
      HRMS_SERVICE_EMAIL: hrms-app-service@newtuple.com
      HRMS_SERVICE_PASSWORD: ${HRMS_SERVICE_PASSWORD:?Run the HRMS setup script}
      HRMS_APP_DATABASE_URL: postgresql://hrms_application:${HRMS_APP_DB_PASSWORD}@hrms-app-db:5432/hrms_application
    ports: ["127.0.0.1:8012:8000"]
    depends_on:
      platform-install:
        condition: service_completed_successfully
      hrms-app-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sm_hrms
      POSTGRES_PASSWORD: ${HRMS_DB_PASSWORD:?Run the HRMS setup script}
      POSTGRES_DB: sm_hrms
    ports: ["127.0.0.1:5456:5432"]
    volumes: ["hrms_db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sm_hrms -d sm_hrms"]
      interval: 3s
      timeout: 3s
      retries: 30
  initialize:
    <<: *api
    command: ["python", "-m", "hrms.bootstrap"]
  api:
    <<: *api
    ports: ["127.0.0.1:8011:8000"]
    volumes: ["hrms_documents:/app/storage"]
    depends_on:
      initialize:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
  web:
    image: sm-hrms-web:local
    build:
      context: ./frontend
      dockerfile: Dockerfile.hrms
    ports: ["127.0.0.1:5181:80"]
    depends_on:
      api:
        condition: service_healthy
  tests:
    <<: *api
    profiles: ["test"]
    environment:
      <<: *environment
      ENV: test
      DATABASE_URL: postgresql+asyncpg://sm_hrms:${HRMS_DB_PASSWORD}@db:5432/sm_hrms_test
    command: ["python", "-m", "pytest", "-c", "hrms/pytest.ini", "hrms/tests", "-q"]

volumes:
  hrms_db:
  hrms_documents:
  hrms_platform_db:
  hrms_application_db:
