<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ATS Transcription</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <div class="panel">
      <div class="header">
        <h1>ATS Transcription</h1>
        <p>Capture the current tab audio + mic and stream to ATS.</p>
      </div>

      <label class="label" for="baseUrl">ATS Base URL</label>
      <input id="baseUrl" class="input" type="text" placeholder="https://ats.example.com" />
      <button id="openAtsBtn" class="btn subtle">Open ATS</button>

      <label class="label" for="applicationSelect">Select candidate</label>
      <select id="applicationSelect" class="select"></select>

      <button id="refreshBtn" class="btn subtle">Refresh candidates</button>

      <label class="toggle">
        <input id="includeMic" type="checkbox" checked />
        <span>Include microphone</span>
      </label>

      <button id="startBtn" class="btn primary">Start transcription</button>
      <button id="stopBtn" class="btn danger" disabled>Stop</button>

      <div id="status" class="status">Ready.</div>

      <div class="meters">
        <div class="meter">
          <span>Tab audio</span>
          <div class="meter-bar">
            <div id="tabMeter" class="meter-fill"></div>
          </div>
        </div>
        <div class="meter">
          <span>Mic</span>
          <div class="meter-bar">
            <div id="micMeter" class="meter-fill"></div>
          </div>
        </div>
      </div>

      <div class="tips">
        <p>Tips</p>
        <ul>
          <li>Make sure the meeting tab is active when you click start.</li>
          <li>When Chrome asks, select the Meet/Teams tab and enable Share audio.</li>
        </ul>
      </div>
    </div>

    <script src="panel.js"></script>
  </body>
</html>
