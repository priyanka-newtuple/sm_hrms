server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 12m;
    location /v1/api/ {
        proxy_pass http://hrms-app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /health { proxy_pass http://hrms-app:8000/health; }
    # Native API Coverage loads the public OpenAPI schema; this exposes no runtime route.
    location = /api/openapi.json { proxy_pass http://platform-api:8000/openapi.json; }
    location / { try_files $uri $uri/ /index.html; }
}
