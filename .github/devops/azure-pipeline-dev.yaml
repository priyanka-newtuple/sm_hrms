trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

stages:

  - stage: Test
    displayName: "Unit Tests"
    condition: or(
                and(eq(variables['Build.Reason'], 'PullRequest'), eq(variables['System.PullRequest.TargetBranch'], 'refs/heads/main')),
                eq(variables['Build.Reason'], 'Manual')
              )
    jobs:
      - job: RunTests
        displayName: "Run Python Unit Tests with a Database"
        pool:
          vmImage: "ubuntu-latest"
        services:
          sqlserver:
            image: mcr.microsoft.com/mssql/server:2019-latest
            env:
              ACCEPT_EULA: "Y"
              SA_PASSWORD: "#password123sdJwnwlk"
              MSSQL_PID: "Developer"
            ports:
              - 1433:1433
            volumes:
              - sqlserver_data:/var/opt/mssql
        steps:
          - checkout: self

          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.11'
              addToPath: true
            displayName: 'Install Python 3.11'

          - task: DownloadSecureFile@1
            displayName: "Download test_dev.env"
            inputs:
              secureFile: "test_dev.env"
            name: downloadTestEnvFile

          - task: DownloadSecureFile@1
            displayName: "Download .env_dev"
            inputs:
              secureFile: ".env_dev"
            name: downloadEnvFile

          - task: DownloadSecureFile@1
            displayName: "Download config_dev.ini"
            inputs:
              secureFile: "config_dev.ini"
            name: downloadConfigIniFile

          - task: DownloadSecureFile@1
            displayName: "Download bot_service_values_dev.yaml"
            inputs:
              secureFile: "bot_service_values_dev.yaml"
            name: downloadBotServiceValuesYamlFile

          - task: DownloadSecureFile@1
            displayName: "Download pushgateway_values_dev.yaml"
            inputs:
              secureFile: "pushgateway_values_dev.yaml"
            name: downloadPushGatewayValuesYamlFile

          - task: DownloadSecureFile@1
            displayName: "Download langfuse_values_dev.yaml"
            inputs:
              secureFile: "langfuse_values_dev.yaml"
            name: downloadLangfuseValuesYamlFile

          - task: DownloadSecureFile@1
            displayName: "Download config_test_dev.ini"
            inputs:
              secureFile: "config_test_dev.ini"
            name: downloadConfigTestIniFile

          - script: |
              echo "Copying downloaded secure files to their final directories..."
              mkdir -p bot_service/src/backend/etc
              mkdir -p bot_service/src/document_processing/etc
              cp "$(downloadEnvFile.secureFilePath)" bot_service/src/backend/etc/.env
              cp "$(downloadConfigIniFile.secureFilePath)" bot_service/src/backend/etc/config.ini
              cp "$(downloadConfigTestIniFile.secureFilePath)" bot_service/src/backend/etc/config_test.ini
              cp "$(downloadTestEnvFile.secureFilePath)" bot_service/src/backend/etc/test.env
              cp "$(downloadEnvFile.secureFilePath)" bot_service/src/document_processing/etc/.env
              cp "$(downloadConfigIniFile.secureFilePath)" bot_service/src/document_processing/etc/config.ini
              cp "$(downloadConfigTestIniFile.secureFilePath)" bot_service/src/document_processing/etc/config_test.ini
              cp "$(downloadTestEnvFile.secureFilePath)" bot_service/src/document_processing/etc/test.env
            displayName: "Copy secure files and setup config directories"

          - script: |
              sudo apt-get update
              sudo ACCEPT_EULA=Y apt-get install -y libodbc1 unixodbc-dev ca-certificates software-properties-common build-essential poppler-utils unzip nano curl unixodbc unixodbc-dev gnupg
              sudo rm -rf /var/lib/apt/lists/*
              curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
              curl https://packages.microsoft.com/config/ubuntu/20.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
              sudo apt-get update
              sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18
            displayName: "Install ODBC libraries for pyodbc"

          - script: |
              pip install -r bot_service/src/backend/requirements.txt
              pip install -r bot_service/src/document_processing/requirements.txt
            displayName: "Install Dependencies"

          - script: |
              echo "Waiting for MSSQL to be ready..."
              sleep 15
            displayName: "Wait for DB Service"

          - script: |
              python3 -c "import pyodbc
              print('Attempting to connect to SQL Server...')
              try:
                  conn = pyodbc.connect('DRIVER={ODBC Driver 18 for SQL Server};SERVER=localhost;DATABASE=master;UID=sa;PWD=#password123sdJwnwlk;TrustServerCertificate=yes')
                  cursor = conn.cursor()
                  cursor.execute('SELECT @@VERSION')
                  row = cursor.fetchone()
                  print('Successfully connected to SQL Server')
                  print('SQL Server version:', row[0])
                  conn.close()
              except Exception as e:
                  print('Error connecting to SQL Server:', str(e))
                  exit(1)"
            displayName: "Test SQL Server Connection"

          - task: DockerInstaller@0
            inputs:
              dockerVersion: '17.09.0-ce'

          - script: |
              sudo docker ps 
            displayName: "Viewing Docker container"

          - script: |
              az account set --subscription cb0f5d39-b859-40c4-a52e-5a22e7189743

              # Get short-lived admin certificate (no device login)
              make -C infra -f dev.mk aks-login 

              export KUBECONFIG=$HOME/.kube/config
              kubelogin convert-kubeconfig -l azurecli  

              echo "Running tests"
              cd bot_service/src/document_processing
              python3 -m pytest tests/unit_tests -p no:warnings -v -s
            displayName: "Run Tests"
  
  - stage: Test_connections_and_access
    displayName: "Test Connections and Access"
    dependsOn: Test
    condition: and(eq(variables['Build.SourceBranch'], 'refs/heads/main'),
                or(
                  eq(variables['Build.Reason'], 'Manual'),
                  ne(variables['Build.Reason'], 'PullRequest')
                )
              )
    jobs:
      - job: TestConnectionsAndAccess
        displayName: "Test Connections and Access"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - checkout: self
          - task: HelmInstaller@1
            inputs:
              helmVersionToInstall: 'latest'
            displayName: 'Install Helm'

          - task: KubectlInstaller@0
            inputs:
              kubectlVersion: 'latest'
            displayName: 'Install kubectl'

          - script: |
              az aks install-cli
              echo "##vso[task.prependpath]$HOME/bin"
            displayName: 'Install kubelogin'

          - task: AzureCLI@2
            displayName: "Test Connections and Access"
            inputs:
              azureSubscription: 'PCR-DEV-QA'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                echo "Executing make test-connections-and-access..."
                az account set --subscription cb0f5d39-b859-40c4-a52e-5a22e7189743

                # Get short-lived admin certificate (no device login)
                make -C infra -f dev.mk aks-login 

                export KUBECONFIG=$HOME/.kube/config
                kubelogin convert-kubeconfig -l azurecli   
                make -C infra -f dev.mk test-all

