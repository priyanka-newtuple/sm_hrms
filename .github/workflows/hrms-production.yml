name: HRMS production
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hrms-production
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main' && vars.HRMS_PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify platform boundary
        run: python scripts/verify-platform-boundary.py
      - name: Build release images
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build -f applications/hrms_api/platform.Dockerfile -t sm-hrms-platform:$SHA .
          docker build -t sm-hrms-application:$SHA applications/hrms_api
          docker run --rm sm-hrms-application:$SHA python -m pytest tests -q
          docker build -f frontend/Dockerfile.platform -t sm-hrms-platform-web:$SHA frontend
          mkdir release
          docker save sm-hrms-platform:$SHA sm-hrms-application:$SHA sm-hrms-platform-web:$SHA | gzip > release/images.tar.gz
          cp deployment/hrms/compose.yml deployment/hrms/deploy.sh deployment/hrms/configure_google.py release/
          cd release && sha256sum images.tar.gz compose.yml deploy.sh configure_google.py > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: hrms-${{ github.sha }}
          path: release/
          retention-days: 7
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: hrms-production
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hrms-${{ github.sha }}
          path: release
      - name: Deploy isolated release
        env:
          SSH_KEY: ${{ secrets.HRMS_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HRMS_DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ vars.HRMS_DEPLOY_HOST }}
          USER: ${{ vars.HRMS_DEPLOY_USER }}
          PORT: ${{ vars.HRMS_DEPLOY_PORT }}
          SHA: ${{ github.sha }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          EMAIL_ENABLED: ${{ secrets.EMAIL_ENABLED }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$HOST" =~ ^[a-zA-Z0-9.-]+$ && "$USER" =~ ^[a-z_][a-z0-9_-]*$ && "$PORT" =~ ^[0-9]+$ ]]
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hrms
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/hrms ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/hrms' EXIT
          opts=(-i ~/.ssh/hrms -o BatchMode=yes -o StrictHostKeyChecking=yes)
          ssh "${opts[@]}" -p "$PORT" "$USER@$HOST" "mkdir -p /opt/newtuple-hrms/releases/$SHA"
          scp "${opts[@]}" -P "$PORT" release/* "$USER@$HOST:/opt/newtuple-hrms/releases/$SHA/"
          # OAuth credentials travel over encrypted stdin, never release artifacts or arguments.
          python3 -c 'import json, os; print(json.dumps({k: os.environ.get(k, "") for k in ("GOOGLE_CLIENT_ID", "GOOGLE_CLIENT_SECRET")}))' | \
            ssh "${opts[@]}" -p "$PORT" "$USER@$HOST" "python3 /opt/newtuple-hrms/releases/$SHA/configure_google.py"
          ssh "${opts[@]}" -p "$PORT" "$USER@$HOST" "bash /opt/newtuple-hrms/releases/$SHA/deploy.sh $SHA"
          # Pass email credentials only over SSH stdin, never command arguments or artifacts.
          python3 -c 'import json, os; print(json.dumps({k: os.environ.get(k, "") for k in ("EMAIL_ENABLED", "EMAIL_FROM", "SMTP_HOST", "SMTP_PORT", "SMTP_USERNAME", "SMTP_PASSWORD")}))' | \
            ssh "${opts[@]}" -p "$PORT" "$USER@$HOST" \
              "IMAGE_TAG=$SHA docker compose --project-name newtuple-hrms-production --env-file /opt/newtuple-hrms/production.env -f /opt/newtuple-hrms/releases/$SHA/compose.yml run --rm -T --no-deps platform-install python -m hrms_app.configure_email"
