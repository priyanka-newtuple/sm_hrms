  fetch_latest_changes:
    name: Fetch latest changes
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Fetch latest changes
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST_DEV }}
          username: ${{ secrets.USERNAME_DEV }}
          key: ${{ secrets.SSH_KEY_DEV }}
          script: |
            set -e
            echo "Starting DEV deployment fetch..."
            cd "${{ secrets.REPO_PATH_DEV }}"
            ./deploy.sh fetch_latest_changes main

  build_deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    needs: fetch_latest_changes
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Build and deploy containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST_DEV }}
          username: ${{ secrets.USERNAME_DEV }}
          key: ${{ secrets.SSH_KEY_DEV }}
          script: |
            set -e
            echo "Starting DEV deployment build..."
            cd "${{ secrets.REPO_PATH_DEV }}"
            ./deploy.sh deploy_ci main

  health_checks:
    name: Health checks
    runs-on: ubuntu-latest
    needs: build_deploy
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Perform health checks
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST_DEV }}
          username: ${{ secrets.USERNAME_DEV }}
          key: ${{ secrets.SSH_KEY_DEV }}
          script: |
            set -e

            cd "${{ secrets.REPO_PATH_DEV }}"
            PROJECT_NAME=$(basename "$(git rev-parse --show-toplevel)" | tr '[:upper:]' '[:lower:]')
            PROJECT_PREFIX="${PROJECT_NAME}_main"
            BACKEND_HEALTH_URL="${{ secrets.BACKEND_HEALTH_URL }}"
            FRONTEND_HEALTH_URL="${{ secrets.FRONTEND_HEALTH_URL }}"
            BACKEND_HEALTH_URL="${BACKEND_HEALTH_URL:-http://localhost:8001/health}"
            FRONTEND_HEALTH_URL="${FRONTEND_HEALTH_URL:-http://localhost:5111}"

            docker ps

            echo "Sleeping for 120 seconds until containers are up..."
            sleep 120

            BACKEND_CODE=$(curl -sS -o /dev/null -w "%{http_code}" "$BACKEND_HEALTH_URL")
            FRONTEND_CODE=$(curl -sS -o /dev/null -w "%{http_code}" "$FRONTEND_HEALTH_URL")

            echo "Backend health check returned: $BACKEND_CODE"
            echo "Frontend health check returned: $FRONTEND_CODE"

            if [ "$BACKEND_CODE" != "200" ]; then
              echo "FAILURE: backend not reachable at $BACKEND_HEALTH_URL"
              docker compose --project-name "$PROJECT_PREFIX" -f docker-compose.prod.yml logs --tail 100 modular-backend || true
              exit 1
            fi

            if [ "$FRONTEND_CODE" != "200" ]; then
              echo "FAILURE: frontend not reachable at $FRONTEND_HEALTH_URL"
              docker compose --project-name "$PROJECT_PREFIX" -f docker-compose.prod.yml logs --tail 100 modular-frontend || true
              exit 1
            fi

            echo "All health checks passed."
