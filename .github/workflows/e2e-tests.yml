name: E2E Tests

on:
  # Automatic runs disabled — re-enable by uncommenting.
  # pull_request:
  #   branches: [main]
  # push:
  #   branches: [main, feat/STAT-362-playwright-e2e-setup]
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: statemachine
          POSTGRES_USER: statemachine
          POSTGRES_PASSWORD: statemachine
        ports:
          - 5455:5432
        options: >-
          --health-cmd "pg_isready -U statemachine -d statemachine"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      # ── Backend ──
      DATABASE_URL: postgresql://statemachine:statemachine@localhost:5455/statemachine
      SQLALCHEMY_DATABASE_MIGRATION_URL: postgresql://statemachine:statemachine@localhost:5455/statemachine
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5455
      POSTGRES_USERNAME: statemachine
      POSTGRES_PASSWORD: statemachine
      POSTGRES_DATABASE: statemachine
      POSTGRES_APP_SCHEMA: modular_backend
      HOST: 0.0.0.0
      PORT: 8001
      REQUEST_TIMEOUT_SECONDS: 60
      REDIS_HOST: localhost
      REDIS_PORT: 6380
      CONFIG_INI_PATH: ./etc/config.ini
      ALEMBIC_CONFIG_PATH: ./alembic.ini
      JWT_SECRET_KEY: ci-test-secret-do-not-use-in-prod
      BOOTSTRAP_ADMIN_EMAIL: admin@test.com
      BOOTSTRAP_ADMIN_PASSWORD: testpass
      BOOTSTRAP_SUPER_ADMIN_EMAIL: superadmin@test.com
      BOOTSTRAP_SUPER_ADMIN_PASSWORD: testpass
      DEFAULT_ORG_ID: 00000000-0000-0000-0000-000000000001
      PLATFORM_ORG_ID: 00000000-0000-0000-0000-000000000000
      # ── Frontend / Playwright ──
      BASE_URL: http://localhost:5173
      TEST_ADMIN_EMAIL: admin@test.com
      TEST_ADMIN_PASSWORD: testpass
      TEST_SUPERADMIN_EMAIL: superadmin@test.com
      TEST_SUPERADMIN_PASSWORD: testpass
      VITE_DEV_PROXY_TARGET: http://127.0.0.1:8001
      CI: true

    steps:
      - uses: actions/checkout@v4

      # ── Python + backend ──
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run database migrations
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Start backend server
        working-directory: backend
        run: python main.py &

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8001/health > /dev/null 2>&1; then
              echo "Backend is ready"
              break
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done

      # ── Node + frontend ──
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Start frontend dev server
        working-directory: frontend
        run: npm run dev &

      - name: Wait for frontend
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5173 > /dev/null 2>&1; then
              echo "Frontend is ready"
              break
            fi
            echo "Waiting for frontend... ($i/30)"
            sleep 2
          done

      # ── Run tests ──
      - name: Run Playwright E2E tests
        working-directory: frontend
        run: npx playwright test

      # ── Artifacts — always uploaded (pass or fail) ──
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-html-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Upload test results (screenshots, traces, videos)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 14
