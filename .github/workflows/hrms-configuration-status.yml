name: HRMS configuration status
on:
  workflow_dispatch:
    inputs:
      archive_equivalent_draft:
        description: Archive only the verified redundant Employee draft
        type: boolean
        default: false
      resume_worker:
        description: Resume the existing HRMS worker after a stopped deployment
        type: boolean
        default: false
      restart_api:
        description: Restart only an unhealthy HRMS native API
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  status:
    if: github.ref == 'refs/heads/main' || (github.ref == 'refs/heads/feat/onboarding-native-journey' && !inputs.restart_api)
    runs-on: ubuntu-latest
    environment: hrms-production
    timeout-minutes: 10
    steps:
      - name: Read promotion journal and running installer status
        env:
          SSH_KEY: ${{ secrets.HRMS_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HRMS_DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ vars.HRMS_DEPLOY_HOST }}
          USER: ${{ vars.HRMS_DEPLOY_USER }}
          PORT: ${{ vars.HRMS_DEPLOY_PORT }}
          RESTART_API: ${{ inputs.restart_api }}
          RESUME_WORKER: ${{ inputs.resume_worker }}
          ARCHIVE_EQUIVALENT_DRAFT: ${{ inputs.archive_equivalent_draft }}
        run: |
          set -euo pipefail
          [[ "$HOST" =~ ^[a-zA-Z0-9.-]+$ && "$USER" =~ ^[a-z_][a-z0-9_-]*$ && "$PORT" =~ ^[0-9]+$ ]]
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hrms
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/hrms ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/hrms' EXIT
          [[ "$RESTART_API" == true || "$RESTART_API" == false ]]
          ssh -i ~/.ssh/hrms -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -p "$PORT" "$USER@$HOST" "bash -s -- '$RESTART_API' '$RESUME_WORKER' '$ARCHIVE_EQUIVALENT_DRAFT'" <<'REMOTE' > status.txt
          set -euo pipefail
          base=/opt/newtuple-hrms
          release=$(readlink -f "$base/current")
          [[ "$release" == "$base/releases/"* ]]
          export IMAGE_TAG=${release##*/}
          [[ "$IMAGE_TAG" =~ ^[a-f0-9]{40}$ ]]
          export HRMS_ARCHIVE_EQUIVALENT_DRAFT=${3:-false}
          if [[ "$HRMS_ARCHIVE_EQUIVALENT_DRAFT" == true ]]; then
            exec 7>"$base/deploy.lock"; flock -n 7
          fi
          if [[ "${2:-false}" == true ]]; then
            exec 8>"$base/deploy.lock"; flock -n 8
            worker=$(docker ps -aq --filter label=com.docker.compose.project=newtuple-hrms-production --filter label=com.docker.compose.service=platform-worker)
            [[ "$worker" =~ ^[a-f0-9]+$ ]]
            docker start "$worker" < /dev/null
            flock -u 8
          fi
          api=$(docker ps -q --filter label=com.docker.compose.project=newtuple-hrms-production --filter label=com.docker.compose.service=platform-api)
          docker logs --since 45m --tail 5000 "$api" 2>&1 | python3 -c 'import sys,json; data=sys.stdin.read(); markers={"missing_approval_template":"no notification.new_user template", "missing_admin_recipients":"no admin emails provided", "missing_mail_service":"mail service not available", "smtp_validated":"SMTP credentials validated successfully", "smtp_send_failed":"Unexpected error sending email via SMTP", "smtp_auth_failed":"SMTP authentication failed", "smtp_exception":"SMTP error:", "smtp_sent":"Email sent successfully via SMTP", "smtp_load_failed":"Failed to load smtp integration", "missing_notifications_manager":"notifications_manager not set", "deferred_send_exception":"deferred send_email failed", "notification_exception":"notify_admins_new_user failed"}; print(json.dumps({key:data.count(marker) for key,marker in markers.items()}))'
          docker inspect --format '{{json .State.Health}}' "$api" < /dev/null
          docker events --since 3h --until "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --filter container="$api" --filter event=oom --format '{{.Time}} {{.Action}}' < /dev/null
          docker exec "$api" sh -c 'if [ -r /sys/fs/cgroup/memory.events ]; then cat /sys/fs/cgroup/memory.events; fi' < /dev/null
          database=$(docker ps -q --filter label=com.docker.compose.project=newtuple-hrms-production --filter label=com.docker.compose.service=platform-db)
          docker exec "$database" sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT state, wait_event_type, wait_event, count(*), max(now()-xact_start) AS oldest_transaction FROM pg_stat_activity WHERE datname=current_database() GROUP BY state,wait_event_type,wait_event"' < /dev/null
          if [[ "$1" == true ]]; then
            exec 9>"$base/deploy.lock"; flock -n 9
            test -z "$(docker ps -q --filter label=com.docker.compose.project=newtuple-hrms-production --filter label=com.docker.compose.service=platform-install)"
            docker compose --project-name newtuple-hrms-production --env-file "$base/production.env" -f "$release/compose.yml" run --rm -T --no-deps platform-install python -c 'import os,psycopg; db=psycopg.connect(os.environ["HRMS_APP_DATABASE_URL"]); rows=db.execute("SELECT state FROM hrms_configuration_releases WHERE organization_id=%s AND package_name=%s",(os.environ["HRMS_ORGANIZATION_ID"],"hrms-core")).fetchall(); assert len(rows)==1 and rows[0][0]["status"] in ("failed","applied"); db.close()' < /dev/null
            api=$(docker ps -q --filter label=com.docker.compose.project=newtuple-hrms-production --filter label=com.docker.compose.service=platform-api)
            test -n "$api"
            test "$(docker inspect --format '{{.State.Health.Status}}' "$api")" = unhealthy
            docker restart "$api" < /dev/null
            for attempt in $(seq 1 30); do
              [[ "$(docker inspect --format '{{.State.Health.Status}}' "$api")" == healthy ]] && break
              sleep 2
            done
            test "$(docker inspect --format '{{.State.Health.Status}}' "$api")" = healthy
            docker compose --project-name newtuple-hrms-production --env-file "$base/production.env" -f "$release/compose.yml" run --rm -T --no-deps platform-install python -m hrms_app.verify_native_setup < /dev/null
          fi
          docker ps --filter label=com.docker.compose.project=newtuple-hrms-production --format '{{.Names}} {{.Status}}' < /dev/null
          docker stats --no-stream --format '{{.Name}} {{.CPUPerc}} {{.MemUsage}}' $(docker ps -q --filter label=com.docker.compose.project=newtuple-hrms-production) < /dev/null
          application=$(docker ps -q --filter label=com.docker.compose.project=newtuple-hrms-production --filter label=com.docker.compose.service=hrms-app)
          docker exec "$application" python -m hrms_app.onboarding_status < /dev/null
          docker exec "$application" python -c 'import os,json; from hrms_app.platform import PlatformClient; p=PlatformClient(os.environ["PLATFORM_API_URL"],os.environ["HRMS_ORGANIZATION_ID"],os.environ["HRMS_SERVICE_EMAIL"],os.environ["HRMS_SERVICE_PASSWORD"]); items=p.call("GET","/integrations/organizations/"+p.org)["items"]; providers={"smtp","ses","azure_communication","microsoft_graph_email"}; print(json.dumps({"mail_providers":[{"provider":i["provider"],"configured":i.get("configured"),"capture_host":i.get("config",{}).get("smtp_host")=="mailpit","smtp_username_present":bool(i.get("secret_hints",{}).get("username")),"smtp_password_present":bool(i.get("secret_hints",{}).get("password"))} for i in items if i["provider"] in providers]})); p.close()' < /dev/null
          docker exec "$application" python -c 'import os,json,psycopg; db=psycopg.connect(os.environ["HRMS_APP_DATABASE_URL"]); rows=db.execute("SELECT progress FROM operations WHERE organization_id=%s AND operation_key LIKE %s",(os.environ["HRMS_ORGANIZATION_ID"],"employee-account:%")).fetchall(); keys=("create_requested","created_user_id","restricted_role_set","invitation_requested","invitation_sent","access_granted"); print(json.dumps({"account_bridge_checkpoints":[{k:bool(p.get(k)) for k in keys} for (p,) in rows]})); db.close()' < /dev/null
          docker exec "$application" python -c 'import os,json; from collections import Counter; from hrms_app.platform import PlatformClient; p=PlatformClient(os.environ["PLATFORM_API_URL"],os.environ["HRMS_ORGANIZATION_ID"],os.environ["HRMS_SERVICE_EMAIL"],os.environ["HRMS_SERVICE_PASSWORD"]); rows=p.call("GET","/workflow-enrollments",params={"entity_type_name":"HRMS.Employee","limit":200}); print(json.dumps({"employee_states":dict(Counter(r["current_state"] for r in rows["items"])),"has_more":rows["has_more"],"user_auth_types":dict(Counter(u.get("auth_type","unavailable") for u in p.users()))})); p.close()' < /dev/null
          docker exec "$application" python -c 'import os,json; print(json.dumps({k:os.environ.get(k) for k in ("HRMS_EMAIL_MODE","HRMS_UAT_INBOX_ENABLED")}))' < /dev/null
          docker compose --project-name newtuple-hrms-production --env-file "$base/production.env" -f "$release/compose.yml" run --rm -T --no-deps platform-install python -c 'import os,json,httpx; from hrms_app.platform import PlatformClient; api=PlatformClient(os.environ["PLATFORM_API_URL"],os.environ["HRMS_ORGANIZATION_ID"],os.environ["HRMS_INSTALL_EMAIL"],os.environ["HRMS_INSTALL_PASSWORD"]); token=api.service_token(); client=httpx.Client(base_url="http://hrms-app:8000/v1/api",headers={"Authorization":"Bearer "+token},timeout=30); caps=client.get("/hrms/capabilities"); caps.raise_for_status(); status=client.get("/hrms/uat-mail/status"); status.raise_for_status(); print(json.dumps({"inbox_status":status.json(),"roles":caps.json().get("roles"),"can_manage_onboarding":"onboarding:manage" in caps.json().get("capabilities",[])})); messages=client.get("/hrms/uat-mail/messages"); print(json.dumps({"mailbox_http_status":messages.status_code,"captured_email_count":messages.json().get("total") if messages.status_code==200 else None})); print(json.dumps({"approval_templates":sum(t.get("action_kind")=="notification.new_user" for t in api.call("GET","/email-templates")["items"]),"legacy_active_admins":sum(u.get("role")=="admin" and u.get("status")=="active" for u in api.users()),"smtp_configured":api.call("GET","/integrations/organizations/"+api.org+"/smtp").get("configured")})); client.close(); api.close()' < /dev/null
          api=$(docker ps -q --filter label=com.docker.compose.project=newtuple-hrms-production --filter label=com.docker.compose.service=platform-api)
          docker logs --since 30m --tail 1500 "$api" 2>&1 | python3 -c 'import sys,re; lines=sys.stdin.readlines(); selected=[line.strip() for line in lines if re.search(r"File .+line [0-9]+|Traceback|GET /health|POST /v1/api/auth/login",line)]; print("\n".join(selected[-35:]))'
          docker compose --project-name newtuple-hrms-production --env-file "$base/production.env" -f "$release/compose.yml" run --rm -T --no-deps platform-install python -c 'import os,json,psycopg; db=psycopg.connect(os.environ["HRMS_APP_DATABASE_URL"]); rows=db.execute("SELECT package_name, state, updated_at FROM hrms_configuration_releases WHERE organization_id=%s",(os.environ["HRMS_ORGANIZATION_ID"],)).fetchall(); print(json.dumps([dict(name=n,status=s.get("status"),checksum=s.get("package_checksum"),completed=len(s.get("completed",[])),pending=s.get("pending"),updated_at=str(t)) for n,s,t in rows])); db.close()' < /dev/null
          docker compose --project-name newtuple-hrms-production --env-file "$base/production.env" -f "$release/compose.yml" run --rm -T --no-deps -e HRMS_ARCHIVE_EQUIVALENT_DRAFT platform-install python - <<'PY'
          import os, json, time, httpx
          from hrms_app.platform import PlatformClient
          def measure(label, call):
              start = time.monotonic()
              try:
                  response = call()
                  print(json.dumps({'timing': label, 'ms': round((time.monotonic()-start)*1000), 'status': response.status_code, 'bytes': len(response.content)}), flush=True)
                  return response
              except Exception:
                  print(json.dumps({'timing': label, 'ms': round((time.monotonic()-start)*1000), 'error': 'request_failed'}), flush=True)
                  return None
          api = PlatformClient(os.environ['PLATFORM_API_URL'], os.environ['HRMS_ORGANIZATION_ID'], os.environ['HRMS_INSTALL_EMAIL'], os.environ['HRMS_INSTALL_PASSWORD'])
          token = api.service_token()
          headers = {'Authorization': 'Bearer '+token}
          with httpx.Client(timeout=35, follow_redirects=False) as client:
              mail = measure('mailpit_list', lambda: client.get('http://mailpit:8025/api/v1/messages'))
              items = mail.json().get('messages', []) if mail is not None and mail.status_code == 200 else []
              message_id = items[0]['ID'] if items else None
              for sample in range(3):
                  for endpoint in ('capabilities', 'employee-work', 'cockpit', 'assets', 'offboarding/inbox', 'projects', 'performance'):
                      result = measure('screen_'+endpoint, lambda: client.get('http://hrms-app:8000/v1/api/hrms/'+endpoint, headers=headers))
                      if endpoint == 'assets' and sample == 0 and result is not None and result.status_code == 200:
                          from collections import Counter
                          inventory = result.json()
                          print(json.dumps({'asset_availability': {'can_manage': inventory.get('can_manage'), 'total': len(inventory['items']), 'states': dict(Counter(r['state'] for r in inventory['items'])), 'assignable': sum('issue' in r['actions'] for r in inventory['items']), 'assigned': sum(bool(r['data'].get('issued_employee_id')) for r in inventory['items'])}}), flush=True)
                  for path in ('auth/me', 'roles/my-permissions', 'users/me/organizations'):
                      measure('native_'+path, lambda: client.get(os.environ['PLATFORM_API_URL'].rstrip('/')+'/'+path, headers=headers))
                  measure('hrms_list', lambda: client.get('http://hrms-app:8000/v1/api/hrms/uat-mail/messages', headers=headers))
                  if message_id:
                      measure('mailpit_detail', lambda: client.get('http://mailpit:8025/api/v1/message/'+message_id))
                      measure('hrms_detail', lambda: client.get('http://hrms-app:8000/v1/api/hrms/uat-mail/messages/'+message_id, headers=headers))
                      measure('public_hrms_detail', lambda: client.get('https://myhub.62-238-103-67.sslip.io/v1/api/hrms/uat-mail/messages/'+message_id, headers=headers))
          active = [w for w in api.call('GET', '/workflow-state-machines', params={'scope':'published'})['published_items'] if w.get('entity_type') == 'HRMS.Employee' and w.get('is_active')]
          def asset_requirements(w):
              return [bool(f.get('required')) for t in w['definition'].get('transitions', []) for f in t.get('required_fields', []) if f.get('field') == 'issued_asset_references']
          print(json.dumps({'active_employee_asset_requirements': [asset_requirements(w) for w in active]}), flush=True)
          for w in active:
              drafts = api.call('GET', '/workflow-state-machines', params={'scope':'draft','machine_name':w['machine_name']})['draft_items']
              for draft in drafts:
                  d = api.call('GET', '/workflow-state-machines/'+draft['id'])
                  if os.getenv('HRMS_ARCHIVE_EQUIVALENT_DRAFT') == 'true' and d['id'] == '775d1de3-466a-4207-8f24-033bfc7694c6':
                      from copy import deepcopy
                      def normalized(value):
                          value = deepcopy(value)
                          for transition in value.get('transitions', []):
                              if 'from_state' in transition:
                                  source = transition.pop('from_state')
                                  assert 'from' not in transition or transition['from'] == source
                                  transition['from'] = source
                          return value
                      assert normalized(d['definition']) == normalized(w['definition']), 'Draft has real workflow edits; preserve it'
                      assert (d.get('canvas_metadata') or {}) == (w.get('canvas_metadata') or {}), 'Draft has canvas edits; preserve it'
                      assert d.get('version') == 0, 'Only a draft may be archived'
                      api.call('DELETE', '/workflow-state-machines/'+d['id'])
                      print('Redundant Employee draft archived after full semantic comparison', flush=True)
                  old = {t['key']:t for t in w['definition'].get('transitions', [])}
                  for t in d['definition'].get('transitions', []):
                      before = old.get(t['key'], {})
                      if before != t:
                          fields = {f['field']:f for f in before.get('required_fields', [])}
                          changes = [{'field':f['field'],'before':fields.get(f['field'],{}).get('required'),'after':f.get('required')} for f in t.get('required_fields', []) if fields.get(f['field'])!=f]
                          print(json.dumps({'draft_transition_change':{'key':t['key'],'different_properties':[k for k in set(t)|set(before) if t.get(k)!=before.get(k)],'required_field_changes':changes}}),flush=True)
                  print(json.dumps({'employee_draft': {'id':d['id'],'updated_at':d.get('updated_at'),'definition_matches_active':d['definition']==w['definition'],'different_sections':[k for k in set(d['definition'])|set(w['definition']) if d['definition'].get(k)!=w['definition'].get(k)],'asset_requirements':asset_requirements(d)}}),flush=True)
          page = api.call('GET', '/workflow-enrollments', params={'entity_type_name':'HRMS.Employee','limit':200})
          versions = {}
          pinned_required = 0
          for row in page['items']:
              if row['workflow_id'] not in versions:
                  versions[row['workflow_id']] = api.call('GET', '/workflow-state-machines/'+row['workflow_id'])
              w = versions[row['workflow_id']]
              terminal = any(s['name'] == row['current_state'] and s.get('is_terminal') for s in w['definition'].get('states', []))
              pinned_required += int(not terminal and any(asset_requirements(w)))
          print(json.dumps({'enrollments_with_required_asset_version':pinned_required,'has_more':page['has_more']}), flush=True)
          target = next((u for u in api.users() if u.get('email', '').lower() == 'shilpa.mishra@newtuple.com'), None)
          if target:
              print(json.dumps({'account_check': {k: target.get(k) for k in ('status', 'auth_type', 'role', 'created_at', 'updated_at', 'last_login')}}), flush=True)
              for event in ('AUTH_PASSWORD_CHANGED', 'AUTH_LOGIN_SUCCESS', 'AUTH_LOGIN_FAILED'):
                  history = api.call('GET', '/audit-events', params={'user_id': target['id'], 'event_type': event, 'limit': 20})
                  print(json.dumps({'account_event': event, 'total': history.get('total'), 'events': [{'timestamp': r.get('event_timestamp'), 'source': r.get('source')} for r in history.get('items', [])]}), flush=True)
          else:
              print(json.dumps({'account_check': 'not_found'}), flush=True)
          api.close()
          PY
          REMOTE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hrms-configuration-status
          path: status.txt
          retention-days: 3
