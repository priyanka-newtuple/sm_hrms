[project]
name = "state-machine"
version = "0.17.0"
description = "Generic state machine platform"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "ruff>=0.7.0",
    "pre-commit>=3.8.0",
    "pyright>=1.1.380",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "venv",
    ".venv",
    "backend/alembic/versions",
    "backend/__pycache__",
    "frontend",
    "node_modules",
    "app",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "RUF",    # ruff-specific
]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # FastAPI Depends() in defaults
    "SIM108", # ternary not always clearer
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["B"]
"**/__init__.py" = ["F401"]
# FastAPI controllers need request/response Pydantic models at runtime for
# body parsing; ruff TC001/TC002 must not move them into TYPE_CHECKING.
"**/controller.py" = ["TC001", "TC002"]
# Pydantic models need their field types at runtime to validate. With
# `from __future__ import annotations`, types in TYPE_CHECKING fail at
# Pydantic init with `class-not-fully-defined`.
"**/models/*.py" = ["TC001", "TC002", "TC003"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
